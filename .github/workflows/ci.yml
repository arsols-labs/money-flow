# Public CI for arsols-labs/money-flow — runs without Cloudflare secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Public fingerprint assert
        working-directory: .
        run: node scripts/assert-public-fingerprints.mjs

      - name: Typecheck
        run: npm run check

      - name: Test (vitest + setup unit)
        run: npm test

      - name: Packaged skill tests
        working-directory: .
        run: python3 -m unittest discover -s skills/money-flow-receipt-processor/scripts -p 'test_*.py'

      - name: Build
        run: npm run build

      - name: Setup dry-run (no Cloudflare secrets)
        run: npm run setup -- --yes --dry-run
        env:
          # Dry-run must not require a token; leave unset on purpose.
          CI: 'true'
